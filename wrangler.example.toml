# Copy to ignored wrangler.toml. Configure PASSWORD with wrangler secret put PASSWORD.
name = "floccus-cf-worker"
main = "src/index.ts"
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
USERNAME = "owner"

[[d1_databases]]
binding = "DB"
database_name = "floccus-bookmarks"
# Local placeholder; npm run configure writes the real UUID.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# No manual SQL import, extra Secrets or Cron configuration is needed.
# After deployment, visit /init to create tables and initialize USERNAME/PASSWORD.
[observability]
enabled = false
